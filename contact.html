<body>
    <header class="header">
        <div class="container">
            <h1 class="logo">TechShop</h1>
            <nav class="navigation">
                <ul class="nav-list">
                    <li><a href="index.html">Главная</a></li>
                    <li><a href="catalog.html">Каталог</a></li>
                    <li><a href="about.html">О нас</a></li>
                    <li><a href="contact.html">Контакты</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="main-content">
        <section class="contact-section">
            <div class="container">
                <h2>Свяжитесь с нами</h2>
                
                <div class="contact-info">
                    <h3>Наши контакты</h3>
                    <p><strong>Телефон:</strong> +7 (495) 123-45-67</p>
                    <p><strong>Email:</strong> info@techshop.ru</p>
                    <p><strong>Адрес:</strong> г. Москва, ул. Примерная, д. 1</p>
                    <p><strong>Режим работы:</strong> Пн-Пт 9:00-18:00</p>
                </div>

                <div class="contact-form-wrapper">
                    <h3>Напишите нам</h3>
                    <form method="POST" action="submit.php" class="contact-form">
                        <div class="form-group">
                            <label for="name">Ваше имя:</label>
                            <input type="text" id="name" name="name" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="email">Email:</label>
                            <input type="email" id="email" name="email" required>
                        </div>
                        
                        <div class="form-group">
                            <label for="message">Сообщение:</label>
                            <textarea id="message" name="message" rows="5" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn">Отправить сообщение</button>
                    </form>
                </div>
            </div>
        </section>
    </main>
